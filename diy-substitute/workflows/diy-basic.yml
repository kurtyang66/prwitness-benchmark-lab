name: PRWitness DIY BASIC

on:
  workflow_dispatch:
    inputs:
      result_path:
        description: Trusted-branch path to a DIY free-result.json
        required: true
        default: fixtures/free-result.json

permissions:
  contents: read

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate local result
        env:
          DIY_RESULT_PATH: ${{ inputs.result_path }}
        run: python3 -m diy.cli basic --input "$DIY_RESULT_PATH"
