name: PRWitness DIY ARTIFACT

on:
  workflow_dispatch:
    inputs:
      metadata_path:
        description: Trusted-branch path to GitHub-shaped artifact metadata JSON
        required: true
        default: fixtures/artifact-metadata.json
      zip_path:
        description: Trusted-branch path to the artifact ZIP
        required: true
        default: fixtures/prwitness-artifact.zip

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate artifact
        env:
          DIY_METADATA_PATH: ${{ inputs.metadata_path }}
          DIY_ZIP_PATH: ${{ inputs.zip_path }}
        run: python3 -m diy.cli artifact --metadata "$DIY_METADATA_PATH" --zip "$DIY_ZIP_PATH"
