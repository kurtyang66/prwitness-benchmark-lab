name: PRWitness DIY HARDENED

on:
  workflow_run:
    workflows: ["PRWitness Free"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # This is the trusted default branch, never workflow_run.head_sha.
      # The PR head is treated as data only and is never checked out or run.
      - name: Checkout trusted evaluator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Evaluate untrusted artifact as data
        env:
          GH_TOKEN: ${{ github.token }}
          DIY_REPOSITORY: ${{ github.repository }}
          DIY_EVENT_PATH: ${{ github.event_path }}
        run: python3 -m diy.cli hardened --event "$DIY_EVENT_PATH" --repository "$DIY_REPOSITORY"
