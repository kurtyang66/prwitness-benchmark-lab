<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRWitness benchmark fixture</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Synthetic GitHub-hosted benchmark</p>
      <h1>PRWitness benchmark fixture</h1>
      <p>This page is deterministic and contains no customer data.</p>
      <p class="flow" data-testid="flow-id">flow-unknown</p>
      <p class="variant" data-testid="variant">head fixture · benchmark branch</p>
    </main>
    <script>
      const flow = new URLSearchParams(location.search).get("flow") || "unknown";
      document.querySelector('[data-testid="flow-id"]').textContent = `flow-${flow.padStart(2, "0")}`;
    </script>
  </body>
</html>
